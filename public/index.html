<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PTV Journey Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:       #003082;
      --primary-mid:   #0052cc;
      --primary-dark:  #001a52;
      --accent:        #ffcd00;
      --bg:            #f0f3f9;
      --surface:       #ffffff;
      --surface-2:     #f7f9fc;
      --border:        #e2e8f0;
      --text:          #1a202c;
      --text-muted:    #64748b;
      --text-light:    #94a3b8;
      --train-color:   #1565c0;
      --tram-color:    #2e7d32;
      --bus-color:     #c62828;
      --radius:        12px;
      --shadow-sm:     0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
      --shadow:        0 4px 16px rgba(0,0,0,0.07), 0 2px 6px rgba(0,0,0,0.04);
      --shadow-lg:     0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Nav ───────────────────────────────────────────────────────── */
    .app-nav {
      display: flex; align-items: center; gap: 4px;
      margin-bottom: 20px;
    }
    .nav-link {
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 13px; font-weight: 500;
      padding: 5px 10px; border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }
    .nav-link:hover, .nav-link.active { color: white; background: rgba(255,255,255,0.1); }
    .nav-spacer { flex: 1; }
    .nav-user {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      margin-right: 4px;
    }
    .nav-btn-ghost {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.8);
      font-size: 12px; font-weight: 600;
      padding: 5px 12px; border-radius: 6px;
      text-decoration: none; border: none;
      cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }
    .nav-btn-ghost:hover { background: rgba(255,255,255,0.18); }
    .nav-btn-accent {
      background: var(--accent);
      color: var(--primary-dark);
      font-size: 12px; font-weight: 700;
      padding: 5px 12px; border-radius: 6px;
      text-decoration: none;
    }

    /* ── Save banner ───────────────────────────────────────────────── */
    .save-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }
    .save-banner-text {
      font-size: 13px; font-weight: 600;
      color: var(--text);
      flex: 1;
    }
    .save-banner input {
      padding: 7px 12px;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      color: var(--text);
      outline: none;
      width: 220px;
      transition: border-color 0.2s;
    }
    .save-banner input:focus { border-color: var(--primary-mid); }
    .save-banner-btn {
      padding: 7px 16px;
      background: var(--primary);
      color: white;
      border: none; border-radius: 7px;
      font-family: inherit;
      font-size: 13px; font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .save-banner-btn:hover { background: var(--primary-mid); }
    .save-banner-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .save-success {
      font-size: 13px; color: #15803d; font-weight: 600;
      display: none;
    }
    .save-error {
      font-size: 13px; color: #b91c1c; font-weight: 600;
      display: none;
      margin-left: 8px;
    }

    /* ── Header ────────────────────────────────────────────────────── */
    .app-header {
      background: linear-gradient(140deg, var(--primary-dark) 0%, var(--primary) 55%, #0a4bba 100%);
      padding: 0 24px;
      position: relative;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 0 36px;
      position: relative; z-index: 1;
    }

    .brand {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 26px;
    }
    .brand-logo {
      width: 38px; height: 38px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800;
      color: var(--primary-dark);
      flex-shrink: 0;
    }
    .brand-text { line-height: 1; }
    .brand-name {
      font-size: 17px; font-weight: 700;
      color: rgba(255,255,255,0.95);
      letter-spacing: -0.3px;
    }
    .brand-name span { color: var(--accent); }
    .brand-sub {
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.45);
      margin-top: 2px; letter-spacing: 0.3px;
    }

    .search-card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: var(--radius);
      padding: 18px 20px 14px;
    }
    .search-label {
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase; letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .form-row {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;
    }
    .form-group {
      flex: 1; min-width: 200px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: rgba(255,255,255,0.55);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute; left: 11px; top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      pointer-events: none;
      opacity: 0.5;
    }
    .form-group input {
      width: 100%;
      padding: 10px 12px 10px 34px;
      background: rgba(255,255,255,0.11);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px; font-weight: 500;
      color: white;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .form-group input::placeholder { color: rgba(255,255,255,0.35); }
    .form-group input:focus {
      border-color: var(--accent);
      background: rgba(255,255,255,0.16);
    }

    .search-btn {
      padding: 10px 26px;
      background: var(--accent);
      color: var(--primary-dark);
      border: none; border-radius: 8px;
      font-family: inherit;
      font-size: 14px; font-weight: 700;
      cursor: pointer;
      height: 40px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    }
    .search-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(255,205,0,0.45);
    }
    .search-btn:active { transform: translateY(0); box-shadow: none; }
    .search-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

    .poi-filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap;
    }
    .poi-filter-label {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .poi-chip-group { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
    .poi-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50px;
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.4);
      cursor: pointer; user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .poi-chip:has(input:checked) {
      background: rgba(255,205,0,0.1);
      border-color: rgba(255,205,0,0.25);
      color: rgba(255,255,255,0.8);
    }
    .poi-chip input { width: 11px; height: 11px; accent-color: var(--accent); }
    .poi-filter-btn {
      padding: 4px 14px;
      background: rgba(255,205,0,0.18);
      border: 1px solid rgba(255,205,0,0.35);
      border-radius: 50px;
      color: rgba(255,230,100,0.95);
      font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .poi-filter-btn:hover { background: rgba(255,205,0,0.28); border-color: rgba(255,205,0,0.55); color: #ffdd44; }
    .poi-filter-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .poi-results-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .poi-results-title {
      font-size: 11px; font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 12px;
    }
    .poi-status { min-height: 16px; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
    .poi-selection-summary { font-size: 11px; color: var(--text-light); margin-bottom: 8px; }
    .poi-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .poi-legend-item {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 8px; border: 1px solid var(--border);
      border-radius: 999px; background: var(--surface);
      font-size: 11px; font-weight: 500; color: var(--text-muted);
    }
    .poi-legend-swatch {
      width: 8px; height: 8px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.85);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.06); flex-shrink: 0;
    }
    .poi-select-btn {
      margin-top: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .poi-select-btn:hover { background: #f0f6ff; color: var(--primary-mid); border-color: #c7d9f5; }
    .poi-select-btn.selected { background: #e8f0fe; color: var(--primary); border-color: #c5d5f5; }

    /* Location button */
    .loc-btn {
      position: absolute; right: 8px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer;
      font-size: 15px;
      opacity: 0.45;
      padding: 4px;
      border-radius: 4px;
      transition: opacity 0.15s;
      line-height: 1;
    }
    .loc-btn:hover { opacity: 0.85; }
    .loc-btn.loading { animation: spin 0.75s linear infinite; opacity: 0.6; }

    /* Dropdown */
    .dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      z-index: 200;
      max-height: 220px; overflow-y: auto;
    }
    .dropdown-item {
      padding: 9px 14px;
      cursor: pointer;
      font-size: 13px; font-weight: 500;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
      transition: background 0.1s;
    }
    .dropdown-item::before { content: '📍'; font-size: 11px; opacity: 0.6; }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover, .dropdown-item.active {
      background: #f0f6ff; color: var(--primary-mid);
    }

    /* Status */
    #status {
      margin-top: 10px;
      min-height: 18px;
      font-size: 13px; font-weight: 500;
    }
    .status-loading {
      color: rgba(255,255,255,0.65);
      display: flex; align-items: center; gap: 7px;
    }
    .status-error { color: #fca5a5; }
    .spinner {
      width: 13px; height: 13px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: rgba(255,255,255,0.85);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Main ──────────────────────────────────────────────────────── */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px 48px;
    }

    #results { display: none; }

    /* Summary pills */
    .summary-strip {
      display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap;
    }
    .metric-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 7px 18px;
      display: inline-flex; align-items: center; gap: 8px;
      box-shadow: var(--shadow-sm);
    }
    .metric-icon { font-size: 15px; }
    .metric-value { font-size: 17px; font-weight: 700; color: var(--text); line-height: 1; }
    .metric-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }

    /* Results grid */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    /* Section title */
    .section-head {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
    }
    .section-head h2 { font-size: 14px; font-weight: 700; color: var(--text); }
    .section-badge {
      background: var(--primary);
      color: white;
      font-size: 11px; font-weight: 700;
      padding: 2px 9px; border-radius: 50px;
    }

    /* Leg cards */
    .leg-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s, transform 0.2s;
      animation: fadeUp 0.35s ease both;
    }
    .leg-card:last-child { margin-bottom: 0; }
    .leg-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
    .leg-card:nth-child(1) { animation-delay: 0.05s; }
    .leg-card:nth-child(2) { animation-delay: 0.10s; }
    .leg-card:nth-child(3) { animation-delay: 0.15s; }
    .leg-card:nth-child(4) { animation-delay: 0.20s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .leg-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .leg-step {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
    }

    .leg-info { flex: 1; min-width: 0; }
    .leg-line {
      font-size: 14px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .leg-stops {
      font-size: 12px; color: var(--text-muted); font-weight: 500; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .leg-stops span { color: var(--text-light); margin: 0 4px; }
    .leg-meta {
      font-size: 12px; color: #475569; margin-top: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .leg-mode {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    .leg-mode-icon { font-size: 20px; }
    .mode-chip {
      font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 50px;
      color: white; letter-spacing: 0.2px;
    }

    .leg-body { padding: 13px 16px; }

    /* Source badge */
    .source-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 3px 10px; border-radius: 50px;
      margin-bottom: 11px;
    }
    .source-badge.ptv  { background: #e8f5e9; color: #1b5e20; }
    .source-badge.ptv::before  { content: '●'; color: #43a047; font-size: 9px; }
    .source-badge.google { background: #fff8e1; color: #bf360c; }
    .source-badge.google::before { content: '●'; color: #fb8c00; font-size: 9px; }

    /* Departure rows */
    .departure-list { display: flex; flex-direction: column; gap: 6px; }
    .departure-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      background: #f5f8ff;
      border: 1px solid #e4ecff;
      border-radius: 8px;
      font-size: 13px;
      transition: background 0.15s;
    }
    .departure-row:hover { background: #edf2ff; }

    .route-chip {
      background: var(--primary-mid);
      color: white;
      font-size: 11px; font-weight: 700;
      padding: 2px 8px; border-radius: 6px;
      flex-shrink: 0;
    }
    .dep-time { font-size: 14px; font-weight: 700; color: var(--text); }
    .dep-platform {
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      background: var(--border);
      padding: 2px 6px; border-radius: 4px;
    }
    .dep-mins {
      margin-left: auto;
      font-size: 12px; font-weight: 600;
      color: var(--primary-mid);
      white-space: nowrap;
    }
    .dep-mins.now  { color: #16a34a; }
    .dep-mins.soon { color: #dc2626; }

    .dep-status {
      font-size: 11px; font-weight: 700;
      padding: 2px 7px; border-radius: 50px;
      white-space: nowrap;
    }
    .dep-status.ontime { background: #e8f5e9; color: #1b5e20; }
    .dep-status.delay  { background: #fee2e2; color: #b91c1c; }

    /* Transfer */
    .transfer-note {
      margin-top: 10px;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-muted);
    }
    .transfer-note::before { content: '↕'; color: var(--text-light); font-size: 14px; }

    /* Map */
    .map-card {
      position: sticky; top: 20px;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .map-card-head {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 700; color: var(--text);
      display: flex; align-items: center; gap: 8px;
    }
    #map { width: 100%; height: 400px; display: block; }
    .map-empty {
      height: 400px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px;
      color: var(--text-light);
      background: var(--surface-2);
      font-size: 13px; text-align: center; padding: 24px;
    }
    .map-empty-icon { font-size: 36px; opacity: 0.35; }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 32px 20px;
      color: var(--text-muted); font-size: 14px;
    }
    .error { color: #ef4444; font-weight: 600; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">P</div>
        <div class="brand-text">
          <div class="brand-name">PTV <span>Journey Planner</span></div>
          <div class="brand-sub">Melbourne Public Transport</div>
        </div>
      </div>

      <nav class="app-nav">
        <a href="/" class="nav-link active">Journey Planner</a>
        <a href="/favorites.html" class="nav-link">Saved Routes</a>
        <div class="nav-spacer"></div>
        <div id="navAuth"></div>
      </nav>

      <div class="search-card">
        <div class="search-label">Plan your journey</div>
        <div class="form-row">
          <div class="form-group">
            <label for="origin">From</label>
            <div class="input-wrap">
              <span class="input-icon">📍</span>
              <input id="origin" type="text" placeholder="Origin station or suburb" autocomplete="off" style="padding-right:32px" />
              <button class="loc-btn" id="locBtn" title="Use my current location" onclick="useMyLocation()">🎯</button>
            </div>
            <div class="dropdown" id="origin-dropdown" style="display:none"></div>
          </div>
          <div class="form-group">
            <label for="destination">To</label>
            <div class="input-wrap">
              <span class="input-icon">🏁</span>
              <input id="destination" type="text" placeholder="Destination station or suburb" autocomplete="off" />
            </div>
            <div class="dropdown" id="destination-dropdown" style="display:none"></div>
          </div>
          <button class="search-btn" id="searchBtn" onclick="search()">Search →</button>
        </div>
        <div id="status"></div>
        <div class="poi-filter-row">
          <span class="poi-filter-label">Nearby</span>
          <div id="poiCategories" class="poi-chip-group">
            <label class="poi-chip"><input type="checkbox" value="coffee" checked><span>Coffee</span></label>
            <label class="poi-chip"><input type="checkbox" value="restaurant" checked><span>Restaurant</span></label>
            <label class="poi-chip"><input type="checkbox" value="hotel" checked><span>Hotel</span></label>
            <label class="poi-chip"><input type="checkbox" value="hospital"><span>Hospital</span></label>
            <label class="poi-chip"><input type="checkbox" value="public toilet"><span>Toilet</span></label>
            <label class="poi-chip"><input type="checkbox" value="bar"><span>Bar</span></label>
            <label class="poi-chip"><input type="checkbox" value="night club"><span>Night club</span></label>
            <label class="poi-chip"><input type="checkbox" value="museum"><span>Museum</span></label>
          </div>
          <button class="poi-filter-btn" id="poiSearchBtn" onclick="searchTargetPlaces()">Find places</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="results">
      <!-- Save as Favorite banner -->
      <div class="save-banner" id="saveBanner">
        <span class="save-banner-text">Save this journey?</span>
        <input type="text" id="saveNameInput" placeholder="Name this route…" maxlength="60" />
        <button class="save-banner-btn" id="saveBannerBtn" onclick="saveJourney()">Save</button>
        <span class="save-success" id="saveSuccess">Saved!</span>
        <span class="save-error" id="saveError"></span>
      </div>

      <div class="summary-strip">
        <div class="metric-pill">
          <span class="metric-icon">⏱</span>
          <span class="metric-value" id="totalDuration">—</span>
          <span class="metric-label">total time</span>
        </div>
        <div class="metric-pill">
          <span class="metric-icon">📏</span>
          <span class="metric-value" id="totalDistance">—</span>
          <span class="metric-label">distance</span>
        </div>
      </div>

      <div class="results-grid">
        <div>
          <div class="section-head">
            <h2>Journey legs</h2>
            <span class="section-badge" id="legCount"></span>
          </div>
          <div id="legs"></div>
        </div>

        <div>
          <div class="map-card">
            <div class="map-card-head">🗺 Route map</div>
            <div id="mapEmpty" class="map-empty" style="display:none;">
              <div class="map-empty-icon">🗺</div>
              Map unavailable — PTV stops not found
            </div>
            <div id="map"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="poiSection" style="display:none;">
      <div class="poi-results-section">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
          <div class="poi-results-title" style="margin-bottom:0;">Nearby places</div>
          <span id="favAutoSaveIndicator" style="font-size:11px;color:#16a34a;font-weight:500;opacity:0;transition:opacity 0.4s;"></span>
        </div>
        <div id="poiStatus" class="poi-status"></div>
        <div id="poiLegend" class="poi-legend"></div>
        <div id="poiSelectionSummary" class="poi-selection-summary"></div>
        <div id="poiResults"></div>
      </div>
    </div>
  </main>

  <script>
    // ── Current location ─────────────────────────────────────────────
    async function useMyLocation() {
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }
      const btn = document.getElementById('locBtn');
      const input = document.getElementById('origin');
      btn.classList.add('loading');
      btn.disabled = true;
      input.placeholder = 'Getting location…';

      navigator.geolocation.getCurrentPosition(
        async ({ coords }) => {
          try {
            const res = await fetch(`/reverse-geocode?lat=${coords.latitude}&lng=${coords.longitude}`);
            const data = await res.json();
            if (res.ok) {
              input.value = data.address;
              input.placeholder = 'Origin station or suburb';
            } else {
              input.placeholder = 'Could not get address';
            }
          } catch {
            input.placeholder = 'Request failed';
          } finally {
            btn.classList.remove('loading');
            btn.disabled = false;
          }
        },
        () => {
          input.placeholder = 'Location access denied';
          btn.classList.remove('loading');
          btn.disabled = false;
        },
        { timeout: 8000 }
      );
    }

    // ── Auth nav ────────────────────────────────────────────────────
    const _token = localStorage.getItem('ptv_token');
    const _user  = JSON.parse(localStorage.getItem('ptv_user') || 'null');

    function updateNav() {
      const navAuth = document.getElementById('navAuth');
      if (_user && _token) {
        navAuth.innerHTML = `
          <span class="nav-user">${_user.email}</span>
          <button class="nav-btn-ghost" onclick="logout()">Logout</button>`;
      } else {
        navAuth.innerHTML = `
          <a href="/login.html" class="nav-btn-ghost">Login</a>
          <a href="/register.html" class="nav-btn-accent" style="margin-left:6px">Register</a>`;
      }
    }

    function logout() {
      localStorage.removeItem('ptv_token');
      localStorage.removeItem('ptv_user');
      window.location.reload();
    }

    updateNav();

    // ── Save journey ─────────────────────────────────────────────────
    let _lastOrigin = '', _lastDestination = '';

    async function saveJourney() {
      if (!_token) { window.location.href = '/login.html'; return; }
      const name = document.getElementById('saveNameInput').value.trim();
      if (!name) { document.getElementById('saveNameInput').focus(); return; }
      const btn = document.getElementById('saveBannerBtn');
      const successEl = document.getElementById('saveSuccess');
      const saveErrorEl = document.getElementById('saveError');
      btn.disabled = true;
      saveErrorEl.style.display = 'none';
      saveErrorEl.textContent = '';
      try {
        const res = await fetch('/favorites', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${_token}` },
          body: JSON.stringify({ name, origin: _lastOrigin, destination: _lastDestination, places: getSelectedPoiPlaces() })
        });
        if (res.status === 401) { window.location.href = '/login.html'; return; }
        if (res.ok) {
          successEl.style.display = 'inline';
          saveErrorEl.style.display = 'none';
          btn.style.display = 'none';
          setTimeout(() => { successEl.style.display = 'none'; btn.style.display = ''; }, 3000);
        } else {
          const data = await res.json().catch(() => ({}));
          saveErrorEl.textContent = data.error || 'Could not save journey';
          saveErrorEl.style.display = 'block';
        }
      } finally {
        btn.disabled = false;
      }
    }

    const ICONS = {
      HEAVY_RAIL: '🚆', COMMUTER_TRAIN: '🚆', RAIL: '🚆',
      TRAM: '🚊', BUS: '🚌', SUBWAY: '🚇', FERRY: '⛴️'
    };
    const MODE_LABEL = {
      HEAVY_RAIL: 'Train', COMMUTER_TRAIN: 'Train', RAIL: 'Train',
      TRAM: 'Tram', BUS: 'Bus', SUBWAY: 'Metro', FERRY: 'Ferry'
    };
    const MODE_COLOR = {
      HEAVY_RAIL: '#1565c0', COMMUTER_TRAIN: '#1565c0', RAIL: '#1565c0',
      TRAM: '#2e7d32', BUS: '#c62828', SUBWAY: '#6a1b9a', FERRY: '#00695c'
    };

    function formatTime(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleTimeString('en-AU', {
        hour: '2-digit', minute: '2-digit',
        timeZone: 'Australia/Melbourne'
      });
    }
    function formatDuration(s) {
      const m = Math.round(s / 60);
      return m < 60 ? `${m} min` : `${Math.floor(m/60)}h ${m % 60}min`;
    }
    function formatDistance(m) {
      return m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${m} m`;
    }

    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // ── Maps API ────────────────────────────────────────────────────
    let map, directionsService, directionsRenderer;
    let infoWindows = [];
    let poiMapMarkers = [], poiMapInfoWindow;
    let mapsApiPromise = null;

    async function loadMapsApi() {
      if (mapsApiPromise) return mapsApiPromise;

      mapsApiPromise = (async () => {
      const cfg = await fetch('/config').then(r => r.json());
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = `https://maps.googleapis.com/maps/api/js?key=${cfg.mapsApiKey}`;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: -37.8136, lng: 144.9631 },
        zoom: 12,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        styles: [
          { featureType: 'poi', stylers: [{ visibility: 'off' }] },
          { featureType: 'transit.station', stylers: [{ visibility: 'simplified' }] }
        ]
      });
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ map, suppressMarkers: true });
      })();

      return mapsApiPromise;
    }

    function clearPoiMarkers() {
      poiMapMarkers.forEach(marker => marker.setMap(null));
      poiMapMarkers = [];
      if (poiMapInfoWindow) poiMapInfoWindow.close();
    }

    function showPoiOnExistingMap(data) {
      if (!map) return;

      const places = (data.categories || [])
        .flatMap(category => (category.places || []).map(place => ({ ...place, category: category.category || place.category })))
        .filter(place => place.location && place.location.lat != null && place.location.lng != null);

      clearPoiMarkers();

      if (!places.length) return;

      if (!poiMapInfoWindow) {
        poiMapInfoWindow = new google.maps.InfoWindow();
      }

      const bounds = new google.maps.LatLngBounds();
      places.forEach((place, index) => {
        const position = {
          lat: Number(place.location.lat),
          lng: Number(place.location.lng)
        };
        const marker = new google.maps.Marker({
          position,
          map,
          label: {
            text: String(index + 1),
            color: 'white',
            fontWeight: '700',
            fontSize: '12px'
          },
          title: place.name || 'POI',
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 10,
            fillColor: getPoiColor(place.category),
            fillOpacity: 1,
            strokeColor: '#001a52',
            strokeWeight: 2.5
          }
        });

        marker.addListener('click', () => {
          poiMapInfoWindow.setContent(`
            <div style="font-family:Inter,sans-serif;font-size:13px;line-height:1.5;max-width:220px;">
              <strong style="color:#1a202c;">${esc(place.name || 'Unnamed place')}</strong><br/>
              <span style="color:#64748b;">${esc(place.category || 'Unknown category')}</span><br/>
              <span style="color:#475569;">${esc(place.address || 'Address unavailable')}</span>
            </div>`);
          poiMapInfoWindow.open(map, marker);
        });

        poiMapMarkers.push(marker);
        bounds.extend(position);
      });

      if (places.length === 1) {
        map.setCenter(bounds.getCenter());
        map.setZoom(Math.max(map.getZoom() || 14, 15));
      } else {
        map.fitBounds(bounds, 48);
      }
    }

    function setRouteMapState(hasRoute) {
      const mapEl = document.getElementById('map');
      const emptyEl = document.getElementById('mapEmpty');
      if (!mapEl || !emptyEl) return;

      if (hasRoute) {
        mapEl.style.display = 'block';
        emptyEl.style.display = 'none';
        if (map) {
          google.maps.event.trigger(map, 'resize');
        }
      } else {
        mapEl.style.display = 'none';
        emptyEl.style.display = 'flex';
      }
    }

    function showRouteOnMap(origin, destination, legs) {
      infoWindows.forEach(w => w.close());
      infoWindows = [];

      setRouteMapState(true);

      directionsService.route(
        { origin, destination, travelMode: google.maps.TravelMode.TRANSIT },
        (result, status) => {
          if (status !== 'OK') return;
          directionsRenderer.setDirections(result);

          result.routes[0].legs[0].steps
            .filter(s => s.travel_mode === 'TRANSIT')
            .forEach((step, i) => {
              const leg = legs[i];
              if (!leg) return;
              const ptv = leg.ptv;
              const markerColor = ptv?.found ? '#0052cc' : '#94a3b8';

              const marker = new google.maps.Marker({
                position: step.start_location,
                map,
                icon: {
                  path: google.maps.SymbolPath.CIRCLE,
                  scale: 9,
                  fillColor: markerColor,
                  fillOpacity: 1,
                  strokeColor: 'white',
                  strokeWeight: 2.5
                },
                title: leg.departure_stop
              });

              let ptvContent = '';
              if (ptv?.found && ptv.departures?.length > 0) {
                const next = ptv.departures[0];
                ptvContent = `
                  <div style="margin-top:6px;padding-top:6px;border-top:1px solid #f0f0f0;font-size:12px;color:#555;">
                    <strong style="color:#0052cc;">PTV</strong> · Next: <strong>${formatTime(next.scheduled_departure)}</strong>
                    ${next.platform ? `· Plat ${next.platform}` : ''}
                  </div>`;
              }

              const infoWindow = new google.maps.InfoWindow({
                content: `
                  <div style="font-family:Inter,sans-serif;font-size:13px;max-width:200px;line-height:1.5;">
                    <strong style="color:#1a202c;">${leg.departure_stop}</strong><br/>
                    <span style="color:#64748b;">${ICONS[leg.mode] || '🚌'} ${leg.line}</span>
                    ${ptvContent}
                  </div>`
              });

              marker.addListener('click', () => {
                infoWindows.forEach(w => w.close());
                infoWindow.open(map, marker);
              });
              infoWindows.push(infoWindow);
            });
        }
      );
    }

    // ── Autocomplete ────────────────────────────────────────────────
    let debounceTimers = {};

    function setupAutocomplete(inputId) {
      const input    = document.getElementById(inputId);
      const dropdown = document.getElementById(`${inputId}-dropdown`);
      let activeIndex = -1;
      let items = [];

      input.addEventListener('input', () => {
        clearTimeout(debounceTimers[inputId]);
        const val = input.value.trim();
        if (val.length < 2) { dropdown.style.display = 'none'; return; }

        debounceTimers[inputId] = setTimeout(async () => {
          try {
            const res  = await fetch(`/autocomplete?input=${encodeURIComponent(val)}`);
            const data = await res.json();
            if (!res.ok) return;
            items = data.suggestions || [];
            activeIndex = -1;
            if (items.length === 0) { dropdown.style.display = 'none'; return; }
            dropdown.innerHTML = items.map((s, i) =>
              `<div class="dropdown-item" data-index="${i}">${s.text}</div>`
            ).join('');
            dropdown.querySelectorAll('.dropdown-item').forEach(el => {
              el.addEventListener('mousedown', () => {
                input.value = items[Number(el.dataset.index)].text;
                dropdown.style.display = 'none';
              });
            });
            dropdown.style.display = 'block';
          } catch(e) { console.error(e); }
        }, 300);
      });

      input.addEventListener('keydown', e => {
        const els = dropdown.querySelectorAll('.dropdown-item');
        if (e.key === 'ArrowDown')  activeIndex = Math.min(activeIndex + 1, els.length - 1);
        else if (e.key === 'ArrowUp')   activeIndex = Math.max(activeIndex - 1, 0);
        else if (e.key === 'Enter') {
          if (activeIndex >= 0 && items[activeIndex]) {
            input.value = items[activeIndex].text;
            dropdown.style.display = 'none';
          } else { search(); }
          return;
        } else if (e.key === 'Escape') { dropdown.style.display = 'none'; }
        els.forEach((el, i) => el.classList.toggle('active', i === activeIndex));
      });

      input.addEventListener('blur', () =>
        setTimeout(() => { dropdown.style.display = 'none'; }, 150)
      );
    }

    setupAutocomplete('origin');
    setupAutocomplete('destination');

    const POI_CATEGORIES = [
      'coffee', 'restaurant', 'hotel', 'hospital',
      'public toilet', 'bar', 'night club', 'museum'
    ];

    const POI_COLORS = {
      coffee: '#6f4e37',
      restaurant: '#c62828',
      hotel: '#1565c0',
      hospital: '#2e7d32',
      'public toilet': '#6b7280',
      bar: '#8e24aa',
      'night club': '#ad1457',
      museum: '#ef6c00'
    };

    const selectedPoiPlaces = new Map();
    let poiPlaceCache = new Map();
  let lastPoiDestination = '';

    function updatePoiSelectionSummary() {
      const count = selectedPoiPlaces.size;
      document.getElementById('poiSelectionSummary').textContent = `Selected places: ${count}`;
    }

    function getPoiColor(category) {
      return POI_COLORS[String(category || '').toLowerCase()] || '#0052cc';
    }

    function renderPoiLegend(data) {
      const legendEl = document.getElementById('poiLegend');
      if (!legendEl) return;

      const categories = (data.categories || [])
        .map(category => category.category || category.label)
        .filter(Boolean);
      const uniqueCategories = [...new Set(categories)];

      legendEl.innerHTML = uniqueCategories.map(category => `
        <span class="poi-legend-item">
          <span class="poi-legend-swatch" style="background:${getPoiColor(category)}"></span>
          ${esc(category)}
        </span>
      `).join('');
    }

    function togglePoiPlace(placeKey) {
      const place = poiPlaceCache.get(placeKey);
      if (!place) return;
      if (selectedPoiPlaces.has(placeKey)) {
        selectedPoiPlaces.delete(placeKey);
      } else {
        selectedPoiPlaces.set(placeKey, place);
      }
      updatePoiSelectionSummary();
      const btn = document.querySelector(`[data-place-key="${placeKey.replace(/"/g, '&quot;')}"]`);
      if (btn) {
        const selected = selectedPoiPlaces.has(placeKey);
        btn.classList.toggle('selected', selected);
        btn.textContent = selected ? 'Selected' : 'Save place';
      }
      autoSavePlacesToFav();
    }

    document.getElementById('poiResults').addEventListener('click', event => {
      const btn = event.target.closest('.poi-select-btn');
      if (!btn) return;
      const placeKey = btn.dataset.placeKey;
      if (!placeKey) return;
      togglePoiPlace(placeKey);
    });

    function getSelectedPoiPlaces() {
      return Array.from(selectedPoiPlaces.values());
    }

    function getSelectedCategories() {
      return Array.from(document.querySelectorAll('#poiCategories input:checked'))
        .map(input => input.value)
        .filter(Boolean);
    }

    function renderPoiPlaceItem(place) {
      const placeKey = place.place_id || `${place.name}:${place.address}`;
      const selected = selectedPoiPlaces.has(placeKey);
      poiPlaceCache.set(placeKey, place);
      const openText = place.open_now === true ? 'Open now' : place.open_now === false ? 'Closed' : 'Hours unknown';
      const ratingText = place.rating ? `⭐ ${place.rating} (${place.user_ratings_total || 0})` : '';
      const distanceText = place.distance_meters != null ? `${place.distance_meters} m away` : '';
      const walkText = place.walking_minutes != null ? `${place.walking_minutes} min walk` : '';
      const extraText = [distanceText, walkText].filter(Boolean).join(' · ');
      return `
        <div class="leg-card" style="margin-bottom:10px;">
          <div class="leg-header">
            <div class="leg-step">•</div>
            <div class="leg-info">
              <div class="leg-line">${place.name}</div>
              <div class="leg-stops">${place.address || 'Address unavailable'}</div>
            </div>
            <div class="leg-mode" style="min-width:110px;">
              <span class="mode-chip" style="background:#ffcd00;color:#001a52;">${openText}</span>
            </div>
          </div>
          <div class="leg-body" style="padding-top:6px;">
            ${extraText ? `<div style="margin-top:10px;font-size:13px;color:#0f172a;font-weight:600;">${extraText}</div>` : ''}
            ${ratingText ? `<div style="margin-top:6px;font-size:13px;color:#475569;">${ratingText}</div>` : ''}
            <button type="button" class="poi-select-btn${selected ? ' selected' : ''}" data-place-key="${placeKey.replace(/"/g, '&quot;')}">
              ${selected ? 'Selected' : 'Save place'}
            </button>
          </div>
        </div>`;
    }

    function renderPoiResults(data) {
      const container = document.getElementById('poiResults');
      if (!data.categories || data.categories.length === 0) {
        container.innerHTML = '<div class="empty-state">No POI categories returned.</div>';
        return;
      }

      container.innerHTML = data.categories.map(category => {
        const places = category.places || [];
        return `
          <div class="section-head" style="margin-top:20px;">
            <h2>${category.label}</h2>
            <span class="section-badge">${places.length} result${places.length !== 1 ? 's' : ''}</span>
          </div>
          ${places.length === 0 ? '<div class="empty-state">No places found for this category.</div>' : places.map(renderPoiPlaceItem).join('')}`;
      }).join('');
    }

    async function searchTargetPlaces() {
      const destination = document.getElementById('destination').value.trim();
      const statusEl    = document.getElementById('poiStatus');
      const resultsEl   = document.getElementById('poiResults');
      const btn         = document.getElementById('poiSearchBtn');
      const categories  = getSelectedCategories();

      if (!destination) {
        document.getElementById('poiSection').style.display = 'block';
        statusEl.innerHTML = '<span style="color:#dc2626;font-size:12px;">Please enter the destination above.</span>';
        return;
      }
      if (categories.length === 0) {
        document.getElementById('poiSection').style.display = 'block';
        statusEl.innerHTML = '<span style="color:#dc2626;font-size:12px;">Select at least one category.</span>';
        return;
      }

      document.getElementById('poiSection').style.display = 'block';
      btn.disabled = true;
      btn.textContent = 'Searching…';
      statusEl.innerHTML = `<span style="color:var(--text-muted);font-size:12px;">Searching nearby places…</span>`;
      resultsEl.innerHTML = '';

      try {
        const res  = await fetch(`/target-places?destination=${encodeURIComponent(destination)}&categories=${encodeURIComponent(categories.join(','))}`);
        const data = await res.json();
        if (!res.ok) {
          const msg = typeof data.error === 'object' ? JSON.stringify(data.error, null, 2) : data.error;
          statusEl.innerHTML = `<span style="color:#dc2626;font-size:12px;">${msg}</span>`;
          return;
        }

        statusEl.innerHTML = `<span style="color:#166534;font-size:12px;font-weight:600;">Found ${data.categories.reduce((sum, c) => sum + (c.places?.length || 0), 0)} places near ${data.destination}.</span>`;
        selectedPoiPlaces.clear();
        renderPoiResults(data);
        renderPoiLegend(data);
        updatePoiSelectionSummary();
        lastPoiDestination = destination;
        await loadMapsApi();
        showPoiOnExistingMap(data);
      } catch (err) {
        statusEl.innerHTML = `<span style="color:#dc2626;font-size:12px;">Request failed: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Find places';
      }
    }

    // ── Render leg ──────────────────────────────────────────────────
    function renderLeg(leg, index, total) {
      const icon      = ICONS[leg.mode]      || '🚌';
      const modeLabel = MODE_LABEL[leg.mode] || leg.mode;
      const modeColor = MODE_COLOR[leg.mode] || '#555';
      const ptv       = leg.ptv;

      let sourceTag = '';
      let timesHtml = '';

      if (ptv?.found && ptv.departures?.length > 0) {
        sourceTag = '<span class="source-badge ptv">PTV real-time</span>';
        timesHtml = `<div class="departure-list">${ptv.departures.map(d => {
          const num      = d.route_number || d.route_name || '?';
          const minsUntil = d.mins_until;
          let minsClass = '';
          let minsText  = '';
          if (minsUntil <= 0)      { minsClass = 'now';  minsText = 'Now'; }
          else if (minsUntil <= 3) { minsClass = 'soon'; minsText = `${minsUntil} min`; }
          else                     { minsText = `${minsUntil} min`; }
          let statusHtml = '';
          if (d.delay) {
            statusHtml = `<span class="dep-status delay">+${d.delay.delay_minutes} min</span>`;
          } else if (d.real_time_departure) {
            statusHtml = `<span class="dep-status ontime">On time</span>`;
          }
          return `
          <div class="departure-row">
            <span class="route-chip">${num}</span>
            <span class="dep-time">${formatTime(d.scheduled_departure)}</span>
            ${d.platform ? `<span class="dep-platform">Plat ${d.platform}</span>` : ''}
            ${statusHtml}
            <span class="dep-mins ${minsClass}">${minsText}</span>
          </div>`;
        }).join('')}</div>`;
      } else if (ptv?.found) {
        sourceTag = '<span class="source-badge ptv">PTV real-time</span>';
        timesHtml = `<p style="color:var(--text-muted);font-size:13px;">No direct services found on PTV for this leg.</p>`;
      } else {
        timesHtml = `<p style="color:var(--text-light);font-size:13px;font-style:italic;">PTV stop not found — departures unavailable.</p>`;
      }

      const transferNote = (total > 1 && index < total - 1)
        ? `<p class="transfer-note">Transfer at <strong>${leg.arrival_stop}</strong></p>`
        : '';

      return `
      <div class="leg-card">
        <div class="leg-header">
          <div class="leg-step">${index + 1}</div>
          <div class="leg-info">
            <div class="leg-line">${leg.line} — ${leg.headsign}</div>
            <div class="leg-stops">${leg.departure_stop}<span>→</span>${leg.arrival_stop}</div>
          </div>
          <div class="leg-mode">
            <div class="leg-mode-icon">${icon}</div>
            <span class="mode-chip" style="background:${modeColor}">${modeLabel}</span>
          </div>
        </div>
        <div class="leg-body">
          ${sourceTag}
          ${timesHtml}
          ${transferNote}
        </div>
      </div>`;
    }

    // ── Search ──────────────────────────────────────────────────────
    async function search() {
      const origin      = document.getElementById('origin').value.trim();
      const destination = document.getElementById('destination').value.trim();
      const btn         = document.getElementById('searchBtn');
      const statusEl    = document.getElementById('status');
      const resultsEl   = document.getElementById('results');

      if (!origin || !destination) {
        statusEl.innerHTML = '<span class="status-error">Please enter both origin and destination.</span>';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Searching…';
      statusEl.innerHTML = `<span class="status-loading"><span class="spinner"></span>Finding the best route…</span>`;
      resultsEl.style.display = 'none';

      try {
        const res  = await fetch(`/journey?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`);
        const data = await res.json();

        if (!res.ok) {
          const msg = typeof data.error === 'object' ? JSON.stringify(data.error, null, 2) : data.error;
          statusEl.innerHTML = `<span class="status-error">${msg}</span>`;
          return;
        }

        statusEl.innerHTML = '';
        document.getElementById('totalDuration').textContent = formatDuration(data.duration_seconds);
        document.getElementById('totalDistance').textContent = formatDistance(data.distance_meters);
        document.getElementById('legCount').textContent      = `${data.legs.length} leg${data.legs.length !== 1 ? 's' : ''}`;

        const legsEl = document.getElementById('legs');
        legsEl.innerHTML = data.legs.length === 0
          ? '<div class="empty-state">No transit legs found for this route.</div>'
          : data.legs.map((leg, i) => renderLeg(leg, i, data.legs.length)).join('');

        resultsEl.style.display = 'block';

        // Show save banner
        _lastOrigin = origin;
        _lastDestination = destination;
        const banner = document.getElementById('saveBanner');
        const successEl = document.getElementById('saveSuccess');
        const saveBtn = document.getElementById('saveBannerBtn');
        document.getElementById('saveNameInput').value = '';
        successEl.style.display = 'none';
        saveBtn.style.display = '';
        if (_token) {
          banner.style.display = 'flex';
        } else {
          banner.style.display = 'flex';
          document.getElementById('saveNameInput').placeholder = 'Login to save routes';
          document.getElementById('saveNameInput').disabled = true;
          saveBtn.textContent = 'Login';
        }

        const hasPtvData = data.legs.some(l => l.ptv?.found);
        if (hasPtvData) {
          showRouteOnMap(origin, destination, data.legs);
        } else {
          setRouteMapState(false);
        }

      } catch (err) {
        statusEl.innerHTML = `<span class="status-error">Request failed: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Search →';
      }
    }

    // Pre-fill from URL params (e.g. coming from favorites "Plan" button)
    const _urlParams = new URLSearchParams(window.location.search);
    const _favId = _urlParams.get('favId') || null;

    (function prefillFromParams() {
      const o = _urlParams.get('origin');
      const d = _urlParams.get('destination');
      if (o) document.getElementById('origin').value = o;
      if (d) document.getElementById('destination').value = d;
      if (o && d) search();
    })();

    let _autoSaveTimer = null;
    async function autoSavePlacesToFav() {
      if (!_favId || !_token) return;
      clearTimeout(_autoSaveTimer);
      _autoSaveTimer = setTimeout(async () => {
        try {
          await fetch(`/favorites/${_favId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${_token}` },
            body: JSON.stringify({ places: getSelectedPoiPlaces() })
          });
          const indicator = document.getElementById('favAutoSaveIndicator');
          if (indicator) {
            indicator.textContent = 'Places saved to route';
            indicator.style.opacity = '1';
            setTimeout(() => { indicator.style.opacity = '0'; }, 2000);
          }
        } catch { /* silent */ }
      }, 600);
    }

    loadMapsApi();
  </script>
</body>
